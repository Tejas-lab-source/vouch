name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  verify:
    name: Lint, format, boundaries, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tool versions
        run: node --version && pnpm --version

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Boundary check
        run: pnpm check:boundaries

      - name: Generated contracts are up to date
        run: pnpm contracts:check

      - name: No breaking contract changes against main
        run: |
          git fetch --no-tags --depth=1 origin main
          pnpm contracts:diff --base origin/main

      - name: Tests (includes Testcontainers smoke test)
        run: pnpm test

      - name: Invariant tests (run alone; concurrency and timing targets)
        run: pnpm test:invariants

  web:
    name: Web build, bundle budget and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @vouch/web build

      - name: Initial JS under 200 KB gzipped
        run: pnpm --filter @vouch/web size

      - name: Install Chromium for Playwright
        run: pnpm --filter @vouch/web exec playwright install --with-deps chromium

      - name: End-to-end tests (real API in Testcontainers)
        run: pnpm --filter @vouch/web e2e

  docker:
    name: Compose services and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example, with local signing keys
        run: |
          cp .env.example .env
          node scripts/dev-keys.js --write

      - name: Start Postgres and Redis and wait until healthy
        run: docker compose up -d --wait --wait-timeout 120

      - name: Show service health
        run: docker compose ps

      - name: Build the API image
        run: docker build -t vouch-api:ci .

      - name: Run migrations from the image
        run: docker run --rm --network host --env-file .env vouch-api:ci node migrations/run.js up

      - name: Run the container and check /health, /ready and /metrics
        run: |
          docker run -d --name vouch-api --network host --env-file .env vouch-api:ci
          for attempt in $(seq 1 30); do
            if body=$(curl -fsS --max-time 2 http://127.0.0.1:3000/health); then
              break
            fi
            sleep 1
          done
          echo "GET /health -> ${body:-<no response>}"
          test "$body" = '{"status":"ok"}'
          ready=$(curl -fsS --max-time 5 http://127.0.0.1:3000/ready)
          echo "GET /ready -> $ready"
          test "$(echo "$ready" | jq -r .status)" = 'ready'
          curl -fsS --max-time 5 http://127.0.0.1:9464/metrics | grep -q '^process_cpu_user_seconds_total'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/metrics)" = '404'

      - name: Stop the container gracefully (drain within the 30 s kill)
        run: |
          docker stop --time 30 vouch-api
          test "$(docker inspect -f '{{.State.ExitCode}}' vouch-api)" = "0"

      - name: Container logs
        if: always()
        run: docker logs vouch-api || true

      - name: Tear down
        if: always()
        run: docker compose down
