# Local development services. Persistence is off: data is lost on `docker compose down`.
# Values come from .env (copy .env.example). Keep image tags in sync with
# packages/config/test/containers.js.
name: vouch

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Local S3 (stands in for Cloudflare R2 and its CDN; ADR 0012). Credentials and the anonymous
  # read rule for photos/ live in infra/seaweedfs/s3.json (development-only values). Create the
  # bucket with `pnpm storage:init`.
  storage:
    image: chrislusf/seaweedfs:4.54
    command: ['server', '-s3', '-s3.config=/etc/vouch/s3.json', '-dir=/data', '-volume.max=10']
    ports:
      - '127.0.0.1:${STORAGE_PORT:-8333}:8333'
    volumes:
      - ./infra/seaweedfs/s3.json:/etc/vouch/s3.json:ro
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 2s
      timeout: 3s
      retries: 30
