# Phase 14 load test (load/README.md): the beta plan's resources on one machine.
# Assumed beta plan (verify against the host before launch):
# - API: one `ROLE=all` process, 0.5 CPU and 512 MB (Render Starter)
# - Postgres: 0.1 CPU and 256 MB (Render Basic-256mb)
# - Redis: 256 MB, given 0.25 CPU (Render Key Value Starter publishes no CPU figure)
# Values come from load/load.env (written by load/run.sh, git-ignored). LOAD_*_CPUS override the
# CPU limits, to measure what each service needs with no limit (the Phase 14 report).
name: vouch-load

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vouch
      POSTGRES_PASSWORD: ${LOAD_DB_PASSWORD:?run load/run.sh}
      POSTGRES_DB: vouch
    # Sized for 256 MB, as a managed plan of that size would be.
    command:
      [
        'postgres',
        '-c',
        'shared_buffers=64MB',
        '-c',
        'effective_cache_size=160MB',
        '-c',
        'work_mem=2MB',
        '-c',
        'max_connections=50',
        '-c',
        'shared_preload_libraries=pg_stat_statements',
        '-c',
        'pg_stat_statements.track=all',
      ]
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    deploy:
      resources:
        limits: { cpus: '${LOAD_PG_CPUS:-0.1}', memory: 256M }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vouch -d vouch']
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '200mb']
    ports:
      - '127.0.0.1:56379:6379'
    deploy:
      resources:
        limits: { cpus: '${LOAD_REDIS_CPUS:-0.25}', memory: 256M }
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ${LOAD_API_IMAGE:-vouch-api:load}
    env_file: load.env
    environment:
      ROLE: all
      DATABASE_URL: postgres://vouch:${LOAD_DB_PASSWORD}@postgres:5432/vouch
      REDIS_URL: redis://redis:6379
      # LOAD_NODE_OPTIONS: for example --cpu-prof (profiling runs; written on a graceful stop).
      NODE_OPTIONS: ${LOAD_NODE_OPTIONS:-}
      DATABASE_POOL_MAX: ${LOAD_DB_POOL_MAX:-10}
    ports:
      - '127.0.0.1:53000:3000'
      - '127.0.0.1:59464:9464'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '${LOAD_API_CPUS:-0.5}', memory: 512M }
